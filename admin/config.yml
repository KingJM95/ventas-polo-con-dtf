backend:
  name: github
  repo: tu-usuario/tu-repositorio-name # ¡Cambia esto por tu usuario y repo!
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "productos"
    label: "Mis Productos"
    folder: "data/productos" # Aquí se guardará cada producto automáticamente
    create: true
    delete: true
    extension: "json" # Formato fácil para leer con HTML/JS
    format: "json"
    slug: "{{fields.title}}"
    fields:
      - { label: "Nombre del Producto", name: "title", widget: "string" }
      - { label: "Precio", name: "price", widget: "number", value_type: "float" }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Imagen del Producto", name: "image", widget: "image" }
