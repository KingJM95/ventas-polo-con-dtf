backend:
  name: github
  repo: KingJM95/ventas-polo-con-dtf
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "productos"
    label: "Mis Productos"
    folder: "data/productos"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{fields.title}}"
    fields:
      - { label: "Nombre del Producto", name: "title", widget: "string" }
      - { label: "Precio", name: "price", widget: "number", value_type: "float" }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Imagen del Producto", name: "image", widget: "image" }
