<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Tienda</title><style>body{font-family:Arial,sans-serif;max-width:1200px;margin:0 auto;padding:20px}h1{text-align:center;color:#333}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;margin-top:30px}.card{border:1px solid #ddd;padding:15px;border-radius:8px;text-align:center;box-shadow:2px 2px 10px rgba(0,0,0,0.05)}.card img{max-width:100%;height:200px;object-fit:cover;border-radius:4px}.price{font-weight:bold;color:#2ecc71;font-size:1.2em;margin:10px 0}.btn{background:#3498db;color:white;border:none;padding:10px 15px;border-radius:5px;cursor:pointer}</style></head><body><h1>🛍️ Mi Tienda de Polos</h1><div id="contenedor-productos" class="grid">Cargando productos...</div><script>const USER="KingJM95",REPO="ventas-polo-con-dtf";async function cargarProductos(){const e=document.getElementById("contenedor-productos");try{const t=await fetch(`https://github.com{USER}/${REPO}/contents/data/productos`);if(!t.ok){e.innerHTML="<p>Aún no hay productos creados. Ve al panel /admin para agregar el primero.</p>";return}const n=await t.json();e.innerHTML="";for(let t of n)if(t.name.endsWith(".json")){const n=await(await fetch(t.download_url)).json(),o=document.createElement("div");o.className="card",o.innerHTML=`<img src="${n.image||"https://placeholder.com"}" alt="${n.title}"><h3>${n.title}</h3><p>${n.description||""}</p><div class="price">$${n.price}</div><button class="btn">Comprar</button>`,e.appendChild(o)}}catch(t){console.error(t),e.innerHTML="<p>Error al conectar con la tienda.</p>"}}cargarProductos();</script></body></html>
