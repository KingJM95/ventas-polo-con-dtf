<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda Online</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; text-align: center; box-shadow: 2px 2px 10px rgba(0,0,0,0.05); }
        .card img { max-width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
        .price { font-weight: bold; color: #2ecc71; font-size: 1.2em; margin: 10px 0; }
        .btn { background: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>🛍️ Mi Tienda Online</h1>
    <div id="contenedor-productos" class="grid">Cargando productos...</div>

    <script>
        // 1. Configura tu usuario y repositorio de GitHub aquí
        const USER = "tu-usuario"; 
        const REPO = "tu-repositorio-name"; 

        async function cargarProductos() {
            const contenedor = document.getElementById('contenedor-productos');
            try {
                // Conectamos con la API de GitHub para ver qué archivos hay en data/productos
                const urlApi = `https://github.com{USER}/${REPO}/contents/data/productos`;
                const respuesta = await fetch(urlApi);
                
                if (!respuesta.ok) {
                    contenedor.innerHTML = "<p>Aún no hay productos creados. Ve al panel /admin para agregar el primero.</p>";
                    return;
                }

                const archivos = await respuesta.json();
                contenedor.innerHTML = ""; // Limpiamos el texto de carga

                // Recorremos cada archivo JSON encontrado
                for (let archivo of archivos) {
                    if (archivo.name.endsWith('.json')) {
                        // Descargamos el contenido de ese producto
                        const resProducto = await fetch(archivo.download_url);
                        const datos = await resProducto.json();

                        // Creamos la tarjeta del producto en HTML
                        const tarjeta = document.createElement('div');
                        tarjeta.className = 'card';
                        tarjeta.innerHTML = `
                            <img src="${datos.image || 'https://placeholder.com'}" alt="${datos.title}">
                            <h3>${datos.title}</h3>
                            <p>${datos.description || ''}</p>
                            <div class="price">$${datos.price}</div>
                            <button class="btn">Comprar</button>
                        `;
                        contenedor.appendChild(tarjeta);
                    }
                }
            } catch (error) {
                console.error("Error cargando productos:", error);
                contenedor.innerHTML = "<p>Error al conectar con la tienda.</p>";
            }
        }

        // Ejecutar la función al abrir la página
        cargarProductos();
    </script>
</body>
</html>
